packages:
  - frontend
  - tests
  - email-templates

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  esbuild@>=0.27.3 <0.28.1: ">=0.28.1"
  next: ">=16.3.6"
  vite@*: 'catalog:'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  vite-plus: 0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
